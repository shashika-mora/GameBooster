[package]
name = "gamebooster"
version = "0.1.0"
edition = "2021"

[lib]
name = "gamebooster_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
log = "0.4"
tauri-plugin-log = "2"
