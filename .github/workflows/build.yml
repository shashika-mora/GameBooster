name: Build native Windows app
on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore --arch x64
        continue-on-error: true
        id: build
      - name: Print WinUI compiler diagnostics
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          $inputs = Get-ChildItem -Path . -Recurse -Filter input.json -ErrorAction SilentlyContinue
          $compiler = Get-ChildItem -Path "$env:USERPROFILE\.nuget\packages" -Recurse -Filter XamlCompiler.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($inputs.Count -eq 0 -or $null -eq $compiler) {
            Write-Error "WinUI compiler input or executable was not found."
          }
          foreach ($input in $inputs) {
            Write-Host "===== XAML compiler diagnostics for $($input.FullName) ====="
            $diagnostic = Join-Path $input.DirectoryName "diagnostic.json"
            & $compiler.FullName $input.FullName $diagnostic 2>&1
            if (Test-Path $diagnostic) {
              Get-Content -Raw $diagnostic
            }
          }
          exit 1
